  <head>
    <meta charset="UTF-8" />

    <meta name="keywords" content="garba songs, non stop garba, garba 2026, navratri songs, dayro, lok dayro, gujarati songs, gujarati gana, gujrati songs, gujarati cinema songs, free gujarati radio, ગરબા, ડાયરો, ગુજરાતી ગીતો, રંગીત" />

    <!-- Canonical -->
    <link rel="canonical" href="https://rangeet-one.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:title" content="રંગીત · Rangeet — Free Gujarati Garba, Dayro & Cinema Songs Radio" />
    <meta property="og:description" content="Free non-stop Gujarati radio — Garba, Dayro & Cinema songs. No ads, no login, just press play." />
    <meta property="og:image" content="https://rangeet-one.vercel.app/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rangeet-one.vercel.app" />
    <meta property="og:locale" content="gu_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="રંગીત · Rangeet" />
    <meta name="twitter:description" content="Free non-stop Gujarati radio — Garba, Dayro & Cinema songs." />
    <meta name="twitter:image" content="https://rangeet-one.vercel.app/og-cover.jpg" />

    <!-- JSON-LD: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Rangeet",
      "alternateName": "રંગીત",
      "url": "https://rangeet-one.vercel.app",
      "description": "A free, non-stop Gujarati music radio featuring Garba, Dayro and Gujarati cinema songs.",
      "inLanguage": ["gu", "en"]
    }
    </script>

    <!-- JSON-LD: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is Rangeet free to use?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes, Rangeet is completely free — no login, no ads, no subscription." }
        },
        {
          "@type": "Question",
          "name": "What kind of music does Rangeet play?",
          "acceptedAnswer": { "@type": "Answer", "text": "Rangeet plays non-stop Gujarati Garba, Dayro, and Gujarati cinema songs." }
        },
        {
          "@type": "Question",
          "name": "Where does the music come from?",
          "acceptedAnswer": { "@type": "Answer", "text": "Music streams through embedded YouTube players. Rangeet does not host any audio; all rights remain with the original artists, labels and composers." }
        },
        {
          "@type": "Question",
          "name": "Do I need to create an account to listen?",
          "acceptedAnswer": { "@type": "Answer", "text": "No account or sign-up is needed. Just open the site and press play." }
        }
      ]
    }
    </script>

    <!-- JSON-LD: MusicPlaylist — Garba -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MusicPlaylist",
      "name": "Garba Songs — Rangeet",
      "description": "Non-stop Garba and Navratri songs on Rangeet.",
      "numTracks": 50,
      "inLanguage": "gu"
    }
    </script>

    <!-- JSON-LD: MusicPlaylist — Dayro -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MusicPlaylist",
      "name": "Dayro & Santvani — Rangeet",
      "description": "Gujarati Dayro, lok dayro and Santvani on Rangeet.",
      "numTracks": 50,
      "inLanguage": "gu"
    }
    </script>

    <!-- JSON-LD: MusicPlaylist — Cinema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MusicPlaylist",
      "name": "Gujarati Cinema Songs — Rangeet",
      "description": "Gujarati film songs and cinema hits on Rangeet.",
      "numTracks": 50,
      "inLanguage": "gu"
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rasa:wght@400;500;600;700&display=swap"
